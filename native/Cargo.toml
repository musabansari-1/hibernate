[package]
name = "hibernate-native"
version = "0.1.0"
edition = "2021"

[features]
# Adds disposable validation entry points and fault injection. Never enabled in packages.
deep-freeze-lab = []

[lib]
name = "hibernate_native"

[[bin]]
name = "hibernate-host"
path = "src/host.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
sha2 = "0.10"
windows = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_Storage_Packaging_Appx", "Win32_System_Recovery", "Win32_System_Environment", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
