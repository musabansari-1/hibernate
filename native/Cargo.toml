[package]
name = "hibernate-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "hibernate_native"

[[bin]]
name = "hibernate-host"
path = "src/host.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
