*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Segoe UI,Inter,system-ui,sans-serif;background:#0d1411;color:#e7f0ea}.slide{width:1270px;height:760px;overflow:hidden;padding:62px 72px;position:relative;background:radial-gradient(circle at 12% -15%,#274c35 0,transparent 38%),linear-gradient(145deg,#0d1411,#101914 55%,#0b110e)}.slide:after{content:"";position:absolute;right:-140px;bottom:-180px;width:520px;height:520px;border:1px solid #244631;border-radius:50%;box-shadow:0 0 0 70px #16241b44,0 0 0 140px #16241b22}.brand{display:flex;align-items:center;gap:13px;font-size:19px;font-weight:700;letter-spacing:-.2px}.mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(145deg,#d7efdf,#78ad88);box-shadow:inset 0 0 0 1px #f0fff5}.eyebrow{font-size:12px;letter-spacing:2.2px;color:#93baa0;font-weight:700;text-transform:uppercase}.title{font-size:62px;line-height:1.02;letter-spacing:-3px;font-weight:620;max-width:910px;margin:32px 0 20px}.title em{font-style:normal;color:#add4b8}.copy{font-size:20px;line-height:1.55;color:#aebfb5;max-width:820px}.pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.pill{font-size:13px;padding:8px 12px;border-radius:999px;border:1px solid #355542;background:#17251c;color:#c9ded0}.panel{background:#142019;border:1px solid #31513e;border-radius:16px;box-shadow:0 28px 80px #0005}.mock{position:absolute;right:72px;top:145px;width:430px;padding:22px}.mock h3{font-size:19px;margin:0 0 8px}.muted{color:#8fa597;font-size:13px}.step{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:15px 0;border-top:1px solid #263c2f}.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1px solid #4f705b;color:#cfe3d5;font-size:12px}.status{font-size:11px;letter-spacing:1px;color:#9fc5ac}.ready{color:#bce5c8}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:42px}.card{padding:20px;background:#142019;border:1px solid #2c4938; </style></head><body><div id="root"></div><script>
const qs=new URLSearchParams(location.search);const slide=qs.get('slide')||'1';
const brand='<div class="brand"><span class="mark"></span><span>ContextSleep</span></div>';
const footer='<div class="footer">Windows private beta · Local-first · Built with GPT-6 Astra</div>';
const slides={
'1':`<section class="slide">${brand}<div style="max-width:680px"><div class="eyebrow" style="margin-top:80px">Put your workspace to sleep</div><h1 class="title">Close the workspace.<br><em>Not the context.</em></h1><p class="copy">Save the context that matters, safely close supported parts, and reconstruct them later with verification instead of guessing what came back.</p><div class="pills"><span class="pill">✓ Review before close</span><span class="pill">✓ Verified restore</span><span class="pill">✓ Local workspace data</span></div></div><div class="panel mock"><div class="eyebrow">Active workspace</div><h3>Product build</h3><p class="muted">One reliable loop from active → asleep → ready.</p><div class="step"><span class="num">1</span><div><b>Connect & assign</b><div class="muted">VS Code + Chrome</div></div><span class="status ready">READY</span></div><div class="step"><span class="num">2</span><div><b>Capture checkpoint</b><div class="muted">Recoverable context saved</div></div><span class="status ready">SAVED</span></div><div class="step"><span class="num">3</span><div><b>Sleep & restore</b><div class="muted">Review → close → verify</div></div><span class="status">OPEN</span></div></div>${footer}</section>`,
'2':`<section class="slide">${brand}<div class="eyebrow" style="margin-top:60px">A deliberate lifecycle</div><h1 class="title" style="font-size:52px;max-width:1020px">Not “reopen some apps.”<br><em>Reconstruct a workspace with evidence.</em></h1><div class="grid"><div class="card"><span class="big-num">01</span><b>Capture</b><p>Save supported browser organization, VS Code context, folders, terminal CWDs and service expectations.</p></div><div class="card"><span class="big-num">02</span><b>Review</b><p>See exactly what is reconstructable. Dirty, unsupported or ambiguous states block automatic close.</p></div><div class="card"><span class="big-num">03</span><b>Sleep</b><p>Only reviewed targets are closed, with a fresh safety check immediately before each action.</p></div><div class="card"><span class="big-num">04</span><b>Resume</b><p>Cold-launch saved context and verify each selected capability before reporting the workspace ready.</p></div></div>${footer}</section>`,
'3':`<section class="slide">${brand}<div class="eyebrow" style="margin-top:58px">Validated, not hand-waved</div><h1 class="title" style="font-size:50px;max-width:920px">The packaged lifecycle passed<br><em>end to end.</em></h1><p class="copy">One checkpoint closed VS Code, Chrome and a reviewed service. ContextSleep restarted, cold-restored the workspace, restarted the approved service, and returned overall readiness to <b class="accent">ready</b>.</p><p class="muted" style="margin:10px 0 0">Actual Windows reboot recovery is intentionally not claimed yet.</p><div class="metric-row" style="margin-top:24px"><div class="metric"><strong>57</strong><small>Rust unit tests</small></div><div class="metric"><strong>25</strong><small>TypeScript tests</small></div><div class="metric"><strong>1</strong><small>real service lifecycle</small></div><div class="metric"><strong>100%</strong><small>package hashes verified</small></div></div><div class="panel" style="margin-top:28px;padding:22px 24px;max-width:940px"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"><div><div class="eyebrow">VS Code</div><b style="display:block;margin-top:8px">Cold restore verified</b></div><div><div class="eyebrow">Chrome</div><b style="display:block;margin-top:8px">Profile restore verified</b></div><div><div class="eyebrow">Service</div><b style="display:block;margin-top:8px">Restart ownership verified</b></div></div></div>${footer}</section>`,
'4':`<section class="slide">${brand}<div class="eyebrow" style="margin-top:58px">Built with GPT-6 Astra</div><h1 class="title" style="font-size:48px;max-width:1000px">Astra helped where<br><em>guessing would be dangerous.</em></h1><div class="case"><div><p class="copy" style="font-size:18px">Astra worked on Windows process/window ownership, durable native-close verification, cold-start recovery, service lifecycle design and end-to-end validation.</p><div class="blocked"><b>Safety decision:</b> if exact native ownership cannot be proven, ContextSleep leaves the window open.</div></div><div class="panel diagram"><div class="eyebrow">Observed VS Code topology</div><div class="process"><b>Code.exe GUI process</b><div class="muted">shared owner</div></div><div class="windows"><div class="window"><b>Workbench A</b><div class="muted">HWND A</div></div><div class="window"><b>Workbench B</b><div class="muted">HWND B</div></div></div><div style="text-align:center;color:#8ea396;margin-top:15px;font-size:13px">No trustworthy stable integration → HWND mapping</div></div></div>${footer}</section>`,
'thumb':`<div class="thumb"><div class="thumb-inner"><div class="thumb-mark"></div><div class="thumb-name">ContextSleep</div><div class="thumb-sub">Sleep · Resume · Ready</div></div></div>`};document.getElementById('root').innerHTML=slides[slide]||slides['1'];
</script></body></html>
